<!DOCTYPE html>
<html>
<head>
  <title>FNAF Guess Who</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: white; }
    .grid { display: grid; grid-template-columns: repeat(4, 100px); gap: 10px; justify-content: center; }
    .card { border: 2px solid white; padding: 10px; cursor: pointer; }
    .hidden { opacity: 0.2; }
    button { margin-top: 20px; padding: 10px; }
  </style>
</head>
<body>

<h1>FNAF Guess Who</h1>

<div id="setup">
  <h2>Player 1: Choose a character</h2>
  <div class="grid" id="chooseGrid"></div>
</div>

<div id="game" style="display:none;">
  <h2>Player 2: Guess the character</h2>
  <div class="grid" id="grid"></div>
  <button onclick="guess()">Make a Guess</button>
</div>

<script>
const characters = [
  "Freddy","Bonnie","Chica","Foxy",
  "Golden Freddy","Springtrap","Ballora","Circus Baby"
];

let chosen = null;

const chooseGrid = document.getElementById("chooseGrid");
const grid = document.getElementById("grid");

characters.forEach(name => {
  let div = document.createElement("div");
  div.className = "card";
  div.innerText = name;

  div.onclick = () => {
    chosen = name;
    alert("Character chosen! Pass to Player 2.");
    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";
  };

  chooseGrid.appendChild(div);
});

characters.forEach(name => {
  let div = document.createElement("div");
  div.className = "card";
  div.innerText = name;
  div.onclick = () => div.classList.toggle("hidden");
  grid.appendChild(div);
});

function guess() {
  let answer = prompt("Who is it?");
  if (answer === chosen) {
    alert("Correct! It was " + chosen);
  } else {
    alert("Nope! Try again.");
  }
}
</script>

</body>
</html>
